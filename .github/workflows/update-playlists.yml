name: Update IPTV playlists

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-playlists.yml'
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download public playlists
        run: |
          set -e
          mkdir -p Americas Europe Countries/Central-America Sources/Ungeoblocked

          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/regions/noram.m3u -o Americas/north-america.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/regions/carib.m3u -o Americas/caribbean.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/regions/southam.m3u -o Americas/south-america.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/regions/eur.m3u -o Europe/europe.m3u

          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/bz.m3u -o Countries/Central-America/belize.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/cr.m3u -o Countries/Central-America/costa-rica.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/sv.m3u -o Countries/Central-America/el-salvador.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/gt.m3u -o Countries/Central-America/guatemala.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/hn.m3u -o Countries/Central-America/honduras.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/ni.m3u -o Countries/Central-America/nicaragua.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/pa.m3u -o Countries/Central-America/panama.m3u

          # Secondary free/ungeoblocked source for USA and Spain.
          curl -L --fail --retry 3 https://raw.githubusercontent.com/matte-oss/iptv-ungeoblocked/main/countries/US.m3u -o Sources/Ungeoblocked/US.m3u
          curl -L --fail --retry 3 https://raw.githubusercontent.com/matte-oss/iptv-ungeoblocked/main/countries/ES.m3u -o Sources/Ungeoblocked/ES.m3u

          curl -L --fail --retry 3 https://iptv-org.github.io/api/channels.json -o /tmp/channels.json
          curl -L --fail --retry 3 https://iptv-org.github.io/api/countries.json -o /tmp/countries.json

          rm -f Americas/central-america.m3u
          rm -f Countries/costa-rica.m3u

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          central_countries = [
              ('Belize', 'belize.m3u'),
              ('Costa Rica', 'costa-rica.m3u'),
              ('El Salvador', 'el-salvador.m3u'),
              ('Guatemala', 'guatemala.m3u'),
              ('Honduras', 'honduras.m3u'),
              ('Nicaragua', 'nicaragua.m3u'),
              ('Panama', 'panama.m3u'),
          ]

          costa_rica_additions = [
              ('TicaVision.cr', 'https://i.imgur.com/mev90pC.jpg', 'TicaVisión - Alternative',
               'https://5eac7b031d945.streamlock.net/TICAVISION/TICAVISION/playlist.m3u8'),
              ('Trivision36.cr', '', 'Trivisión 36 - Alternative',
               'https://liveingesta118.cdnmedia.tv/trivisionlive/rtmp01-900/chunklist.m3u8?DVR=403'),
              ('Teletica.cr', '', 'Teletica 7 - Alternative',
               'https://www.teletica.com/TeleticaLiveStreamCR/Stream/playlist_dvr.m3u8'),
              ('Canal4.cr', '', 'Repretel Canal 4 - Alternative',
               'https://alba-cr-repretel-c4.stream.mediatiquestream.com/index.m3u8'),
              ('Canal6.cr', '', 'Repretel Canal 6 - Alternative',
               'https://alba-cr-repretel-c6.stream.mediatiquestream.com/index.m3u8'),
              ('Canal11.cr', '', 'Repretel Canal 11 - Alternative',
               'https://alba-cr-repretel-c11.stream.mediatiquestream.com/index.m3u8'),
          ]

          base = Path('Countries/Central-America')
          cr_path = base / 'costa-rica.m3u'
          cr_text = cr_path.read_text(encoding='utf-8')
          existing_names = cr_text.lower()
          additions = []
          for tvg_id, logo, name, url in costa_rica_additions:
              if name.lower() not in existing_names:
                  logo_attr = f' tvg-logo="{logo}"' if logo else ''
                  additions.extend([
                      f'#EXTINF:-1 tvg-id="{tvg_id}"{logo_attr} group-title="General",{name}',
                      url,
                  ])
          if additions:
              cr_path.write_text(cr_text.rstrip() + '\n' + '\n'.join(additions) + '\n', encoding='utf-8')

          channels = json.loads(Path('/tmp/channels.json').read_text(encoding='utf-8'))
          countries = json.loads(Path('/tmp/countries.json').read_text(encoding='utf-8'))
          country_names = {c.get('code'): c.get('name', c.get('code')) for c in countries}
          channel_country = {c.get('id'): c.get('country') for c in channels if c.get('id')}
          channel_categories = {c.get('id'): c.get('categories') or [] for c in channels if c.get('id')}
          central_codes = {'BZ', 'CR', 'SV', 'GT', 'HN', 'NI', 'PA'}

          def set_group(line, group):
              if 'group-title=' in line:
                  return re.sub(r'group-title="[^"]*"', f'group-title="{group}"', line)
              comma = line.find(',')
              if comma != -1:
                  return line[:comma] + f' group-title="{group}"' + line[comma:]
              return line

          def tvg_id_from(line):
              m = re.search(r'tvg-id="([^"]+)"', line)
              return m.group(1) if m else None

          def category_for(channel_id, original_line):
              categories = channel_categories.get(channel_id) or []
              if categories:
                  return ' / '.join(str(x).replace('_', ' ').title() for x in categories)
              m = re.search(r'group-title="([^"]*)"', original_line)
              if m and m.group(1).strip():
                  return m.group(1).strip()
              return 'Other'

          output = ['#EXTM3U']
          seen = set()
          seen_ids = set()

          def add_entry(extinf, extras, url):
              key = (tvg_id_from(extinf) or extinf, url)
              if key in seen:
                  return False
              output.append(extinf)
              output.extend(extras)
              output.append(url)
              seen.add(key)
              cid = tvg_id_from(extinf)
              if cid:
                  seen_ids.add(cid.split('@', 1)[0])
              return True

          # Central America stays grouped by country.
          for country, filename in central_countries:
              lines = (base / filename).read_text(encoding='utf-8').splitlines()
              current_extinf = None
              extras = []
              for line in lines:
                  if line.startswith('#EXTINF:'):
                      current_extinf = set_group(line, country)
                      extras = []
                  elif line.startswith('#') and current_extinf:
                      extras.append(line)
                  elif line and line != '#EXTM3U' and current_extinf:
                      add_entry(current_extinf, extras, line)
                      current_extinf = None
                      extras = []

          regional_files = [
              (Path('Americas/north-america.m3u'), True),
              (Path('Americas/south-america.m3u'), False),
              (Path('Europe/europe.m3u'), False),
          ]
          for path, country_and_category in regional_files:
              lines = path.read_text(encoding='utf-8').splitlines()
              current_extinf = None
              extras = []
              for line in lines:
                  if line.startswith('#EXTINF:'):
                      tvg_id = tvg_id_from(line)
                      channel_id = tvg_id.split('@', 1)[0] if tvg_id else None
                      code = channel_country.get(channel_id)
                      if code in central_codes:
                          current_extinf = None
                          extras = []
                          continue
                      country = country_names.get(code, code or 'Other')
                      if country_and_category:
                          category = category_for(channel_id, line)
                          group = f'{country} - {category}'
                      else:
                          group = country
                      current_extinf = set_group(line, group)
                      extras = []
                  elif line.startswith('#') and current_extinf:
                      extras.append(line)
                  elif line and line != '#EXTM3U' and current_extinf:
                      add_entry(current_extinf, extras, line)
                      current_extinf = None
                      extras = []

          # Add USA + Spain secondary streams only when that channel ID is not already
          # represented in the primary build. This avoids cluttering the master list.
          secondary_files = [
              (Path('Sources/Ungeoblocked/US.m3u'), 'United States'),
              (Path('Sources/Ungeoblocked/ES.m3u'), 'Spain'),
          ]
          for path, country in secondary_files:
              lines = path.read_text(encoding='utf-8').splitlines()
              current_extinf = None
              extras = []
              for line in lines:
                  if line.startswith('#EXTINF:'):
                      cid = tvg_id_from(line)
                      base_id = cid.split('@', 1)[0] if cid else None
                      if base_id and base_id in seen_ids:
                          current_extinf = None
                          extras = []
                          continue
                      category = category_for(base_id, line) if country == 'United States' else 'Ungeoblocked'
                      group = f'{country} - {category}' if country == 'United States' else f'{country} - Ungeoblocked'
                      current_extinf = set_group(line, group)
                      extras = []
                  elif line.startswith('#') and current_extinf:
                      extras.append(line)
                  elif line and line != '#EXTM3U' and current_extinf:
                      add_entry(current_extinf, extras, line)
                      current_extinf = None
                      extras = []

          Path('fernando-tv.m3u').write_text('\n'.join(output) + '\n', encoding='utf-8')
          print(f'Built master playlist with {len(seen)} unique streams')
          PY

      - name: Commit playlist updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Americas Europe Countries Sources fernando-tv.m3u
          if git diff --cached --quiet; then
            echo "No playlist changes"
          else
            git commit -m "Update IPTV playlists"
            git push
          fi
