name: Update IPTV playlists

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-playlists.yml'
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and build public playlists
        run: |
          set -e
          mkdir -p Americas Europe Countries/Central-America Sources/Ungeoblocked
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/us.m3u -o Americas/usa.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/mx.m3u -o Americas/mexico.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/regions/southam.m3u -o Americas/south-america.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/es.m3u -o Europe/spain.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/it.m3u -o Europe/italy.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/bz.m3u -o Countries/Central-America/belize.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/cr.m3u -o Countries/Central-America/costa-rica.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/sv.m3u -o Countries/Central-America/el-salvador.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/gt.m3u -o Countries/Central-America/guatemala.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/hn.m3u -o Countries/Central-America/honduras.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/ni.m3u -o Countries/Central-America/nicaragua.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/pa.m3u -o Countries/Central-America/panama.m3u
          curl -L --fail --retry 3 https://raw.githubusercontent.com/matte-oss/iptv-ungeoblocked/main/countries/US.m3u -o Sources/Ungeoblocked/US.m3u
          curl -L --fail --retry 3 https://raw.githubusercontent.com/matte-oss/iptv-ungeoblocked/main/countries/ES.m3u -o Sources/Ungeoblocked/ES.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/api/channels.json -o /tmp/channels.json
          curl -L --fail --retry 3 https://iptv-org.github.io/api/countries.json -o /tmp/countries.json
          rm -f Americas/north-america.m3u Americas/caribbean.m3u Americas/central-america.m3u Europe/europe.m3u Countries/costa-rica.m3u

          python3 - <<'PY'
          import json, re
          from pathlib import Path
          channels=json.loads(Path('/tmp/channels.json').read_text(encoding='utf-8'))
          countries=json.loads(Path('/tmp/countries.json').read_text(encoding='utf-8'))
          meta={c.get('id'):c for c in channels if c.get('id')}
          country_names={c.get('code'):c.get('name',c.get('code')) for c in countries}
          central=[('Belize','belize.m3u'),('Costa Rica','costa-rica.m3u'),('El Salvador','el-salvador.m3u'),('Guatemala','guatemala.m3u'),('Honduras','honduras.m3u'),('Nicaragua','nicaragua.m3u'),('Panama','panama.m3u')]
          cr_additions=[
            ('TicaVision.cr','TicaVisión - Alternative','https://5eac7b031d945.streamlock.net/TICAVISION/TICAVISION/playlist.m3u8'),
            ('Trivision36.cr','Trivisión 36 - Alternative','https://liveingesta118.cdnmedia.tv/trivisionlive/rtmp01-900/chunklist.m3u8?DVR=403'),
            ('Teletica.cr','Teletica 7 - Alternative','https://www.teletica.com/TeleticaLiveStreamCR/Stream/playlist_dvr.m3u8'),
            ('Canal4.cr','Repretel Canal 4 - Alternative','https://alba-cr-repretel-c4.stream.mediatiquestream.com/index.m3u8'),
            ('Canal6.cr','Repretel Canal 6 - Alternative','https://alba-cr-repretel-c6.stream.mediatiquestream.com/index.m3u8'),
            ('Canal11.cr','Repretel Canal 11 - Alternative','https://alba-cr-repretel-c11.stream.mediatiquestream.com/index.m3u8')]
          cr=Path('Countries/Central-America/costa-rica.m3u'); txt=cr.read_text(encoding='utf-8')
          for cid,name,url in cr_additions:
            if name.lower() not in txt.lower(): txt+=f'\n#EXTINF:-1 tvg-id="{cid}" group-title="General",{name}\n{url}\n'
          cr.write_text(txt,encoding='utf-8')
          def tvg_id(line):
            m=re.search(r'tvg-id="([^"]+)"',line); return m.group(1) if m else None
          def set_group(line,group):
            if 'group-title=' in line:return re.sub(r'group-title="[^"]*"',f'group-title="{group}"',line)
            p=line.find(','); return line[:p]+f' group-title="{group}"'+line[p:] if p>=0 else line
          def entries(path):
            cur=None; extras=[]
            for line in Path(path).read_text(encoding='utf-8').splitlines():
              if line.startswith('#EXTINF:'):cur=line;extras=[]
              elif line.startswith('#') and cur:extras.append(line)
              elif line and line!='#EXTM3U' and cur:yield cur,extras,line;cur=None;extras=[]
          def base_id(line):
            x=tvg_id(line);return x.split('@',1)[0] if x else None
          def broad_category(cid,line):
            cats=(meta.get(cid) or {}).get('categories') or [];s=' '.join(str(x).lower() for x in cats)+' '+line.split(',',1)[-1].lower()
            if any(x in s for x in ['news','weather']):return 'News & Weather'
            if any(x in s for x in ['kids','children','animation','cartoon']):return 'Kids'
            if any(x in s for x in ['movie','movies','cinema','film']):return 'Movies'
            if any(x in s for x in ['series','entertainment','comedy','drama']):return 'Series & Entertainment'
            if any(x in s for x in ['sport','football','soccer','baseball','basketball']):return 'Sports'
            if 'music' in s:return 'Music'
            if any(x in s for x in ['documentary','science','education','culture']):return 'Documentary & Culture'
            return 'General'
          def is_spanish_us(cid,line):
            m=meta.get(cid) or {};langs=[str(x).lower() for x in (m.get('languages') or [])];text=(cid or '').lower()+' '+line.lower()
            return any(x in langs for x in ['spa','es','spanish']) or any(x in text for x in ['univision','telemundo','estrella','televisa','azteca','latino','español','spanish'])
          out=['#EXTM3U'];seen=set();seen_ids=set()
          def add(ext,extras,url):
            key=(base_id(ext) or ext,url)
            if key in seen:return
            out.extend([ext,*extras,url]);seen.add(key)
            if base_id(ext):seen_ids.add(base_id(ext))
          for ext,extra,url in entries('Americas/usa.m3u'):
            cid=base_id(ext);cat=broad_category(cid,ext);group=f'USA Spanish - {cat}' if is_spanish_us(cid,ext) else f'USA - {cat}';add(set_group(ext,group),extra,url)
          for ext,extra,url in entries('Americas/mexico.m3u'):add(set_group(ext,'Mexico - '+broad_category(base_id(ext),ext)),extra,url)
          base=Path('Countries/Central-America')
          for country,file in central:
            for ext,extra,url in entries(base/file):add(set_group(ext,country),extra,url)
          for ext,extra,url in entries('Americas/south-america.m3u'):
            cid=base_id(ext);code=(meta.get(cid) or {}).get('country');country=country_names.get(code,code or 'South America');add(set_group(ext,country),extra,url)
          for country,path in [('Spain','Europe/spain.m3u'),('Italy','Europe/italy.m3u')]:
            for ext,extra,url in entries(path):add(set_group(ext,country),extra,url)
          for country,path in [('USA','Sources/Ungeoblocked/US.m3u'),('Spain','Sources/Ungeoblocked/ES.m3u')]:
            for ext,extra,url in entries(path):
              cid=base_id(ext)
              if cid and cid in seen_ids:continue
              if country=='USA':
                cat=broad_category(cid,ext);group=f'USA Spanish - {cat}' if is_spanish_us(cid,ext) else f'USA - {cat}'
              else:group='Spain'
              add(set_group(ext,group),extra,url)

          # Small international news section. Spanish versions are included where available.
          add('#EXTINF:-1 tvg-id="RT.ru@SD" group-title="International News",RT News',[], 'https://rt-glb.rttv.com/live/rtnews/playlist.m3u8')
          add('#EXTINF:-1 tvg-id="RTenEspanol.ru@SD" group-title="International News",RT en Español',[], 'https://rt-esp.rttv.com/live/rtesp/playlist.m3u8')
          add('#EXTINF:-1 tvg-id="EuronewsSpanish.fr@SD" group-title="International News",Euronews Español',[], 'https://cdn-euronews.akamaized.net/live/eds/euronews-es/25053/index.m3u8')
          add('#EXTINF:-1 tvg-id="AlJazeera.qa@English" group-title="International News",Al Jazeera English',[], 'https://live-hls-apps-aje-v3-fa.getaj.net/AJE/index.m3u8')
          Path('fernando-tv.m3u').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print(f'Built master playlist with {len(seen)} unique streams')
          PY

      - name: Commit playlist updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Americas Europe Countries Sources fernando-tv.m3u
          if git diff --cached --quiet; then echo "No playlist changes"; else git commit -m "Update IPTV playlists"; git push; fi
