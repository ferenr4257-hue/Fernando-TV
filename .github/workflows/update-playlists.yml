name: Update IPTV playlists

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-playlists.yml'
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download public playlists
        run: |
          set -e
          mkdir -p Americas Europe Countries/Central-America

          # Regional playlists
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/regions/noram.m3u -o Americas/north-america.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/regions/cenamer.m3u -o Americas/central-america.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/regions/carib.m3u -o Americas/caribbean.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/regions/southam.m3u -o Americas/south-america.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/regions/eur.m3u -o Europe/europe.m3u

          # Central America separated by country
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/bz.m3u -o Countries/Central-America/belize.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/cr.m3u -o Countries/Central-America/costa-rica.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/sv.m3u -o Countries/Central-America/el-salvador.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/gt.m3u -o Countries/Central-America/guatemala.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/hn.m3u -o Countries/Central-America/honduras.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/ni.m3u -o Countries/Central-America/nicaragua.m3u
          curl -L --fail --retry 3 https://iptv-org.github.io/iptv/countries/pa.m3u -o Countries/Central-America/panama.m3u

          # Keep the original Costa Rica shortcut for compatibility
          cp Countries/Central-America/costa-rica.m3u Countries/costa-rica.m3u

      - name: Commit playlist updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Americas Europe Countries
          if git diff --cached --quiet; then
            echo "No playlist changes"
          else
            git commit -m "Update IPTV playlists"
            git push
          fi
