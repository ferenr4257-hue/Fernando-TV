name: Prioritize Central America

on:
  workflow_run:
    workflows: ["Update IPTV playlists"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorder:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put Central America and FOX HBO first
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('fernando-tv.m3u')
          lines = path.read_text(encoding='utf-8').splitlines()
          header = lines[0] if lines and lines[0].startswith('#EXTM3U') else '#EXTM3U'
          priority = ['Costa Rica','Nicaragua','Panama','Guatemala','El Salvador','Honduras','Belize']
          buckets = {g: [] for g in priority}
          rest = []

          def parse_entries(lines):
            entries=[]; i=1
            while i < len(lines):
              if not lines[i].startswith('#EXTINF:'):
                i += 1; continue
              entry=[lines[i]]; i += 1
              while i < len(lines) and not lines[i].startswith('#EXTINF:'):
                if lines[i]: entry.append(lines[i])
                i += 1
              entries.append(entry)
            return entries

          for entry in parse_entries(lines):
            m=re.search(r'group-title="([^"]*)"',entry[0]); group=m.group(1) if m else ''
            if group in buckets: buckets[group].append(entry)
            else: rest.append(entry)

          # Add the separate FOX/HBO source to the master near the top without changing its source file.
          extra=[]
          source=Path('Sources/FOX-HBO-Scribd.m3u')
          if source.exists():
            extra=parse_entries(source.read_text(encoding='utf-8').splitlines())

          # Deduplicate by stream URL so reruns remain clean.
          seen=set(); out=[header]
          def emit(entry):
            url=entry[-1] if entry else ''
            if url in seen: return
            seen.add(url); out.extend(entry)

          # Central America stays at the very top in this exact country order.
          for group in priority:
            for entry in buckets[group]: emit(entry)
          # Then the newly-added FOX/HBO collection.
          for entry in extra: emit(entry)
          # Then everything else in its existing order.
          for entry in rest: emit(entry)

          path.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit reordered master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fernando-tv.m3u
          if git diff --cached --quiet; then
            echo "Priority channels already first"
          else
            git commit -m "Keep Central America and FOX HBO first"
            git push
          fi
